# ==============================================================
# Exp 4: Hybrid stream hyperparameter search
# Semantic and structural stream optimal configs determined by Exp 1-3 and fixed
# Evaluate on training and validation sets only, test set not involved
# Before use, ensure config/config_article.py has:
#   ENABLE_HYBRID_ENCODING = True
#   Semantic stream parameters set to Exp 1-2 optimal values
#   STRUCT_ENCODER and structural stream parameters set to Exp 3 optimal values
# ==============================================================
description: "Exp 4: Hybrid stream hyperparameter search"

base_config: "config.config_article"

grid:
  HYBRID_PROJ_DIM:
    - 256
    - 512
    - 1024
  HYBRID_GATE_DIM:
    - 64
    - 128
    - 256
