# ==============================================================
# Exp 3b-lora: PolyBERT structural stream LoRA fine-tuning hyperparameter search
# Pooling type and MLP head determined by Exp 3b (frozen) and fixed
# Evaluate on training and validation sets only, test set not involved
# Before use, ensure config/config_stru_article.py has:
#   STRUCT_ENCODER = "polybert", FROZEN_BACKBONE = False
#   LORA_DROPOUT = 0.1
#   STRUCT_POOLING_TYPE and MLP_HIDDEN_DIM set to Exp 3b optimal values
# ==============================================================
description: "Exp 3b-lora: PolyBERT structural stream LoRA fine-tuning hyperparameter search"

base_config: "config.config_stru_article"

# LoRA rank and alpha bound search (alpha = 2 * r)
linked_grid:
  _lora_pair:
    params: [LORA_R, LORA_ALPHA]
    values:
      - [4, 8]
      - [8, 16]
      - [16, 32]
